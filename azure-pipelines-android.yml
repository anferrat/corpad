# Android
# Build your Android project with Gradle.
# Add steps that test, sign, and distribute the APK, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/android

trigger: none

variables:
  - group: AndroidUpload

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: yarn install
  displayName: 'Install dependencies'

- script: |
    VERSION_NAME=$(node -pe "require('./package.json').version")
    echo "##vso[task.setvariable variable=VERSION_NAME]$VERSION_NAME"
  displayName: 'Extract Version Name from package.json'

- script: npm run bootstrap-ui-kitten
      displayName: 'Run UI Kitten Bootstrap Script'

- task: Gradle@2
  inputs:
   gradleWrapperFile: 'android/gradlew'
    workingDirectory: 'android/'
    options: '-PversionName=$(Build.BuildNumber) -PversionCode=$(Build.BuildId)'
    tasks: 'bundleRelease'
    publishJUnitResults: false
    javaHomeOption: 'JDKVersion'
    jdkVersion: '17'
    gradleOptions: '-Xmx3072m'
  displayName: 'Build AAB'

- task: AndroidSigning@2
  inputs:
    apkFiles: '**/*.aab'
    jarsign: true 
    jarsignerKeystoreFile: 'my-upload-key.keystore'
    jarsignerKeystorePassword: '$(KeyStorePassword)'
    jarsignerKeystoreAlias: '$(KeyAlias)'
    jarsignerKeyPassword: '$(KeyPassword)'
    jarsignerArguments: '-sigalg SHA256withRSA -digestalg SHA-256'
    zipalign: false
  displayName: 'Sign AAB file'

- task: CopyFiles@2
  inputs:
    contents: '**/*.aab'
    targetFolder: '$(build.artifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: $(Build.ArtifactStagingDirectory)
    artifactName: MyBuildOutputs